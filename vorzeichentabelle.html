<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vorzeichentabelle – gebrochen-rationale Funktionen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1c2330; --muted:#5d6676; --line:#d9d5cb;
  --acc:#0e6b63; --acc-soft:#e3f1ef; --plus:#157a3c; --minus:#c1272d; --zero:#2149c9; --nd:#767c86;
  --ok:#e6f5ea; --bad:#fbe5e5; --hl:#fff3c9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;color:var(--ink);background:var(--bg)}
i.v{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-weight:500}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.25}
.frac>span{padding:0 .25em}
.frac>.n{border-bottom:1.5px solid currentColor}
header{background:var(--ink);color:#fff;padding:18px 20px 0}
header .wrap{max-width:1200px;margin:0 auto}
header h1{margin:0;font-size:1.45rem;font-weight:700;letter-spacing:.2px}
header p{margin:2px 0 12px;color:#c6ccd6;font-size:.98rem}
nav.tabs{display:flex;gap:4px}
nav.tabs a{color:#dfe4ea;text-decoration:none;padding:10px 18px;border-radius:10px 10px 0 0;font-weight:600}
nav.tabs a.active{background:var(--bg);color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
h2{font-size:1.3rem;margin:0 0 10px}
h3{font-size:1.08rem;margin:16px 0 6px}
.muted{color:var(--muted)}
button{font-family:inherit;font-size:1rem;cursor:pointer}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:10px;font-weight:600;min-height:42px}
.btn:hover{border-color:#b9b4a8}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Anleitung */
.steps{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:.92rem;color:var(--muted);min-height:36px}
.steps button.done{color:var(--acc);border-color:#b7d8d3}
.steps button.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.gsec{margin-bottom:22px;scroll-margin-top:12px}
.guide{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
@media (max-width:900px){.guide{grid-template-columns:1fr}}
.guide .text h2 .num{display:inline-block;background:var(--acc);color:#fff;border-radius:8px;padding:0 9px;margin-right:8px;font-size:1rem;vertical-align:2px}
.guide .text ul{padding-left:1.2em;margin:.4em 0}
.guide .text li{margin:.25em 0}
.box{border-left:4px solid var(--acc);background:var(--acc-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}
.box.warn{border-color:#c98a0b;background:#fdf4df}
.demo{min-height:200px}
.navbtns{display:flex;justify-content:space-between;margin-top:18px}
.bigf{font-size:1.5rem;text-align:center;padding:18px 0}
.chain{font-size:1.2rem;display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:8px 0}
.chain .lbl{font-size:.9rem;color:var(--muted)}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fcfbf8}
.mini h4{margin:0 0 6px;font-size:1rem}
.mini p{margin:.3em 0 .5em;font-size:.95rem}

/* Tabelle */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;padding-bottom:4px}
table.vzt{border-collapse:collapse;font-size:1rem;background:#fff}
table.vzt th,table.vzt td{border:1px solid var(--line);padding:6px 8px;text-align:center;min-width:3.4em;white-space:nowrap}
table.vzt th{font-weight:600;background:#f3f1ea}
table.vzt th.pt,table.vzt td.pt{background:#f8f6f0}
table.vzt th.ptH{background:#ebe7dc}
table.vzt .lab{text-align:left;position:sticky;left:0;background:#fff;z-index:1;min-width:7.5em}
table.vzt .lab small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;line-height:1.1}
table.vzt tr.resrow>*{border-top:3px double var(--ink)}
table.vzt tr.introw td{font-size:.82rem;white-space:normal;min-width:5.8em}
table.vzt.compact th,table.vzt.compact td{padding:4px 6px;min-width:2.8em}
table.vzt tr.hl>td,table.vzt tr.hl>th{background:var(--hl)!important}
.sg{font-weight:700;font-size:1.15rem}
.s-plus{color:var(--plus)} .s-minus{color:var(--minus)} .s-zero{color:var(--zero)} .s-nd{color:var(--nd);font-size:.9rem}
td.cell{padding:0}
td.cell button{width:100%;min-width:3.4em;min-height:44px;border:0;background:transparent;font-weight:700;font-size:1.2rem;color:var(--ink)}
td.cell button:empty::after{content:"·";color:#c4bfb3}
td.cell.sel{outline:3px solid var(--acc);outline-offset:-3px}
td.ok{background:var(--ok)!important} td.bad{background:var(--bad)!important}
td select{font-family:inherit;font-size:.88rem;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:11em}
.palette{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.palette button{min-width:54px;min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:1.25rem;font-weight:700}
.palette button:disabled{opacity:.3}
.palette .hint{font-size:.9rem;color:var(--muted)}

/* Zahlengerade + Testwert */
svg.nl{width:100%;height:auto;display:block}
.testval{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;background:#fcfbf8}
.testval input{font-family:inherit;font-size:1rem;width:6em;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.testval .chips{display:inline-flex;gap:6px;flex-wrap:wrap;margin-left:6px}
.testval .chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;min-height:34px}
.testval table{border-collapse:collapse;margin-top:8px}
.testval td{padding:3px 10px 3px 0}
canvas.plot{width:100%;height:320px;display:block;background:#fff;border:1px solid var(--line);border-radius:12px}

/* Übungen */
.ex{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.ex{grid-template-columns:1fr}}
.tasklist .lvl{font-size:.8rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.tasklist .lvl:first-child{margin-top:0}
.tasklist .lvl span{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:.85rem}
.tasklist button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:8px 10px;border-radius:9px;margin:2px 0;color:var(--ink);min-height:40px}
.tasklist button:hover{background:#f1efe8}
.tasklist button.active{background:var(--acc-soft);border-color:#b7d8d3;font-weight:600}
.tasklist .st{font-size:.95rem}
.tasklist .st.ok{color:var(--plus)} .tasklist .st.help{color:#b7791f}
@media (max-width:900px){
  .tasklist{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .tasklist .lvl{display:none}
  .tasklist button{width:auto;white-space:nowrap;border-color:var(--line);background:#fff}
}
.task h2 small{font-weight:400;color:var(--muted);font-size:.9rem;margin-left:6px}
.func{font-size:1.35rem;margin:10px 0 4px}
.stage{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
.stage.locked{opacity:.5}
.stage h3{margin:0 0 8px;display:flex;gap:8px;align-items:center}
.stage h3 .badge{background:var(--ink);color:#fff;border-radius:7px;font-size:.85rem;padding:1px 8px}
.stage.passed h3 .badge{background:var(--plus)}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.field label{min-width:15em}
.field input{font-family:inherit;font-size:1rem;padding:8px 10px;border:1px solid var(--line);border-radius:9px;width:12em}
.field input.ok{background:var(--ok);border-color:#9fd2ae} .field input.bad{background:var(--bad);border-color:#e3a3a3}
.fb{margin-top:10px;padding:9px 12px;border-radius:9px;font-size:.97rem}
.fb.ok{background:var(--ok);color:#14532d} .fb.bad{background:var(--bad);color:#7f1d1d} .fb.info{background:#eef2f8;color:#1e3a5f}
.deriv{background:#faf8f3;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:10px}
.deriv .ds{margin:8px 0;font-size:1.08rem}
.success{background:var(--ok);border:1px solid #a8d8b6;border-radius:12px;padding:14px 16px;margin-top:14px}
.success h3{margin:0 0 6px;color:#14532d}
.summary{margin:8px 0;font-size:.97rem}
.summary li{margin:.2em 0}
footer{max-width:1200px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Die Vorzeichentabelle (VZT)</h1>
    <p>Kurvendiskussion gebrochen-rationaler Funktionen – Schritt für Schritt</p>
    <nav class="tabs">
      <a href="#anleitung" id="tab-anleitung">1 · Anleitung</a>
      <a href="#uebungen" id="tab-uebungen">2 · Übungen</a>
    </nav>
  </div>
</header>
<main>
  <section id="view-anleitung"></section>
  <section id="view-uebungen" hidden></section>
</main>
<footer>Tipp: In den Übungen ein Feld antippen und dann unten „+“, „−“, „0“ oder „n.d.“ wählen. Auf einer Tastatur gehen auch die Tasten + − 0 n sowie die Pfeiltasten.</footer>

<script>
/* ---------- Hilfsfunktionen für Mathe-Darstellung ---------- */
const MINUS = '−';
function mx(s){ return String(s).replace(/x/g,'<i class="v">x</i>'); }
const E = mx;
function F(n,d){ return `<span class="frac"><span class="n">${mx(n)}</span><span class="d">${mx(d)}</span></span>`; }
function fmt(v){
  if (Math.abs(v-Math.round(v))<1e-9) v=Math.round(v);
  const a=Math.abs(v); let s;
  if (Number.isInteger(a)) s=String(a);
  else { s=null; for(let d=2;d<=12;d++){const n=a*d; if(Math.abs(n-Math.round(n))<1e-9){s=Math.round(n)+'/'+d;break;}} if(!s) s=String(+a.toFixed(3)).replace('.',','); }
  return (v<0?MINUS:'')+s;
}
function fmtDec(v){
  if(!isFinite(v)) return 'n.d.';
  const r=Math.round(v*1000)/1000;
  return (r<0?MINUS:'')+String(Math.abs(r)).replace('.',',');
}

/* ---------- Faktoren & Analyse ---------- */
// lin: (a·x + b)^p ; const: Zahl c ; pos: Term ohne Nullstelle (immer > 0)
const L=(a,b,p,den,label)=>({t:'lin',a,b,p,den:!!den,label});
const C=(c,label)=>({t:'const',c,den:false,label});
const P=(label,den)=>({t:'pos',den:!!den,label});
const Q=(roots,lead,den,label)=>({t:'q',roots,lead,den:!!den,label});

function factorSign(f,x){
  if(f.t==='const') return Math.sign(f.c);
  if(f.t==='pos') return 1;
  if(f.t==='q'){ let v=f.lead; for(const r of f.roots) v*=(x-r); return Math.abs(v)<1e-12?0:Math.sign(v); }
  const v=f.a*x+f.b; if(Math.abs(v)<1e-12) return 0;
  return Math.pow(Math.sign(v),f.p);
}
function factorValue(f,x){
  if(f.t==='const') return f.c;
  if(f.t==='lin') return Math.pow(f.a*x+f.b,f.p);
  return NaN;
}
const sym = s => s===0?'0':(s>0?'+':MINUS);
function uniq(arr){ const out=[]; arr.slice().sort((a,b)=>a-b).forEach(v=>{ if(!out.some(w=>Math.abs(w-v)<1e-9)) out.push(v); }); return out; }

const KIND={
  f:{ ivTxt:{'+':'oberhalb der x-Achse','−':'unterhalb der x-Achse'}, ivOpts:['oberhalb der x-Achse','unterhalb der x-Achse'],
      ptOpts:['Nullstelle mit VZW','Nullstelle ohne VZW','Polstelle mit VZW','Polstelle ohne VZW'],
      pt:(pole,l,r)=>(pole?'Polstelle':'Nullstelle')+(l!==r?' mit VZW':' ohne VZW') },
  d1:{ ivTxt:{'+':'streng monoton steigend','−':'streng monoton fallend'}, ivOpts:['streng monoton steigend','streng monoton fallend'],
      ptOpts:['Hochpunkt','Tiefpunkt','Sattelpunkt','Polstelle'],
      pt:(pole,l,r)=>pole?'Polstelle':(l===r?'Sattelpunkt':(l==='+'?'Hochpunkt':'Tiefpunkt')) },
  d2:{ ivTxt:{'+':'linksgekrümmt','−':'rechtsgekrümmt'}, ivOpts:['linksgekrümmt','rechtsgekrümmt'],
      ptOpts:['Wendestelle','keine Wendestelle','Polstelle'],
      pt:(pole,l,r)=>pole?'Polstelle':(l!==r?'Wendestelle':'keine Wendestelle') }
};

function analyze(task){
  const z=[],p=[];
  task.factors.forEach(f=>{ if(f.t==='lin'){ const r=-f.b/f.a; (f.den?p:z).push(r);} if(f.t==='q') f.roots.forEach(r=>(f.den?p:z).push(r)); });
  const zeros=uniq(z), poles=uniq(p), pts=uniq(zeros.concat(poles));
  const cols=[];
  if(!pts.length) cols.push({type:'iv',test:0,lo:null,hi:null});
  pts.forEach((x,i)=>{
    cols.push({type:'iv',test:i===0?x-1:(pts[i-1]+x)/2,lo:i===0?null:pts[i-1],hi:x});
    cols.push({type:'pt',x,pole:poles.some(q=>Math.abs(q-x)<1e-9)});
  });
  if(pts.length) cols.push({type:'iv',test:pts[pts.length-1]+1,lo:pts[pts.length-1],hi:null});
  const rows=task.factors.map(f=>cols.map(c=>sym(factorSign(f,c.type==='pt'?c.x:c.test))));
  const res=cols.map(c=>{
    if(c.type==='pt') return c.pole?'n.d.':'0';
    let s=1; task.factors.forEach(f=>s*=factorSign(f,c.test)); return sym(s);
  });
  const K=KIND[task.kind];
  const interp=cols.map((c,j)=> c.type==='iv'? K.ivTxt[res[j]] : K.pt(c.pole,res[j-1],res[j+1]));
  return {zeros:zeros.filter(x=>!poles.some(q=>Math.abs(q-x)<1e-9)),poles,pts,cols,rows,res,interp};
}
function colLabel(c){
  if(c.type==='pt') return `<b>${fmt(c.x)}</b>`;
  if(c.lo===null&&c.hi===null) return mx('x ∈ ℝ');
  if(c.lo===null) return mx(`x &lt; ${fmt(c.hi)}`);
  if(c.hi===null) return mx(`x &gt; ${fmt(c.lo)}`);
  return mx(`${fmt(c.lo)} &lt; x &lt; ${fmt(c.hi)}`);
}
function rowLabel(f){
  const tag=f.t==='const'?'Konstante':(f.t==='q'?(f.den?'ganzer Nenner':'ganzer Zähler'):(f.den?'Nenner':'Zähler'));
  return `${mx(f.label)}<small>${tag}</small>`;
}
function sgClass(v){ return v==='+'?'s-plus':v===MINUS?'s-minus':v==='0'?'s-zero':v==='n.d.'?'s-nd':''; }
function sc(v,type,extra=''){ return `<td class="${type} ${extra}"><span class="sg ${sgClass(v)}">${v}</span></td>`; }

function staticTable(task,o={}){
  const A=analyze(task); const fn=task.fname||'f(x)';
  let h=`<div class="tblwrap"><table class="vzt${o.compact?' compact':''}">`;
  h+=`<tr class="${o.hl==='head'?'hl':''}"><th class="lab">${mx('x')}</th>`+A.cols.map(c=>`<th class="${c.type==='pt'?'pt ptH':'iv'}">${colLabel(c)}</th>`).join('')+'</tr>';
  if(o.rows!==false) task.factors.forEach((f,i)=>{
    h+=`<tr class="${o.hl==='rows'?'hl':''}"><th class="lab">${rowLabel(f)}</th>`+A.cols.map((c,j)=>o.emptyRows?`<td class="${c.type}">&nbsp;</td>`:sc(A.rows[i][j],c.type)).join('')+'</tr>';
  });
  if(o.res!==false) h+=`<tr class="resrow ${o.hl==='res'?'hl':''}"><th class="lab">${mx(fn)}</th>`+A.cols.map((c,j)=>o.emptyRes?`<td class="${c.type}">&nbsp;</td>`:sc(A.res[j],c.type)).join('')+'</tr>';
  if(o.interp) h+=`<tr class="introw ${o.hl==='interp'?'hl':''}"><th class="lab">Bedeutung</th>`+A.cols.map((c,j)=>`<td class="${c.type}">${mx(A.interp[j])}</td>`).join('')+'</tr>';
  return h+'</table></div>';
}

/* ---------- Zahlengerade ---------- */
function numberLine(zeros,poles){
  const pts=uniq(zeros.concat(poles)); const W=640,H=110, x0=50,x1=590;
  const X=i=>x0+(i+1)*(x1-x0)/(pts.length+1);
  let s=`<svg class="nl" viewBox="0 0 ${W} ${H}" role="img" aria-label="Zahlengerade mit kritischen Stellen">`;
  s+=`<line x1="20" y1="55" x2="${W-20}" y2="55" stroke="#1c2330" stroke-width="2"/><path d="M${W-20} 55 l-10 -6 v12z" fill="#1c2330"/>`;
  s+=`<text x="${W-24}" y="82" font-size="16" font-style="italic" font-family="Georgia,serif" fill="#1c2330">x</text>`;
  pts.forEach((v,i)=>{
    const isP=poles.some(q=>Math.abs(q-v)<1e-9), cx=X(i);
    s+=`<line x1="${cx}" y1="45" x2="${cx}" y2="65" stroke="#1c2330" stroke-width="1.5"/>`;
    s+= isP? `<line x1="${cx}" y1="38" x2="${cx}" y2="72" stroke="#c1272d" stroke-width="2" stroke-dasharray="5 4"/><circle cx="${cx}" cy="55" r="7" fill="#fff" stroke="#c1272d" stroke-width="2.5"/>`
           : `<circle cx="${cx}" cy="55" r="7" fill="#2149c9"/>`;
    s+=`<text x="${cx}" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2330">${fmt(v)}</text>`;
    s+=`<text x="${cx}" y="30" text-anchor="middle" font-size="13" fill="${isP?'#c1272d':'#2149c9'}">${isP?'Nenner = 0':'Zähler = 0'}</text>`;
  });
  return s+'</svg>';
}

/* ---------- Funktionsplot ---------- */
function niceStep(r){ const e=Math.pow(10,Math.floor(Math.log10(r))); const m=r/e; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*e; }
function drawPlot(cv,o){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight; if(!W) return;
  cv.width=W*dpr; cv.height=H*dpr; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const [x0,x1]=o.xr,[y0,y1]=o.yr, pad=26;
  const X=x=>pad+(x-x0)/(x1-x0)*(W-2*pad), Y=y=>H-pad-(y-y0)/(y1-y0)*(H-2*pad);
  g.clearRect(0,0,W,H);
  const sx=niceStep((x1-x0)/12), sy=niceStep((y1-y0)/9);
  g.strokeStyle='#ece9e1'; g.lineWidth=1; g.font='12px "Source Sans 3",sans-serif'; g.fillStyle='#5d6676';
  for(let x=Math.ceil(x0/sx)*sx;x<=x1;x+=sx){ g.beginPath(); g.moveTo(X(x),pad); g.lineTo(X(x),H-pad); g.stroke(); if(Math.abs(x)>1e-9){ g.textAlign='center'; g.fillText(fmt(+x.toFixed(6)),X(x),Math.min(H-pad,Math.max(pad,Y(0)))+15);} }
  for(let y=Math.ceil(y0/sy)*sy;y<=y1;y+=sy){ g.beginPath(); g.moveTo(pad,Y(y)); g.lineTo(W-pad,Y(y)); g.stroke(); if(Math.abs(y)>1e-9){ g.textAlign='right'; g.fillText(fmt(+y.toFixed(6)),Math.min(W-pad,Math.max(pad,X(0)))-5,Y(y)+4);} }
  g.strokeStyle='#1c2330'; g.lineWidth=1.5;
  if(y0<0&&y1>0){ g.beginPath(); g.moveTo(pad,Y(0)); g.lineTo(W-pad,Y(0)); g.stroke(); }
  if(x0<0&&x1>0){ g.beginPath(); g.moveTo(X(0),pad); g.lineTo(X(0),H-pad); g.stroke(); }
  g.save(); g.setLineDash([6,5]); g.strokeStyle='#c1272d'; g.lineWidth=1.5;
  (o.poles||[]).forEach(p=>{ g.beginPath(); g.moveTo(X(p),pad); g.lineTo(X(p),H-pad); g.stroke(); });
  g.restore();
  g.save(); g.beginPath(); g.rect(pad,pad,W-2*pad,H-2*pad); g.clip();
  g.strokeStyle='#0e6b63'; g.lineWidth=2.6; g.beginPath();
  let pen=false, px=null; const N=1400, lim=(y1-y0)*30;
  for(let i=0;i<=N;i++){
    const x=x0+(x1-x0)*i/N, y=o.fn(x);
    const cross=px!==null&&(o.poles||[]).some(p=>(px-p)*(x-p)<=0);
    px=x;
    if(!isFinite(y)||Math.abs(y)>lim||cross){ pen=false; continue; }
    if(!pen){ g.moveTo(X(x),Y(y)); pen=true; } else g.lineTo(X(x),Y(y));
  }
  g.stroke(); g.restore();
  (o.marks||[]).forEach(m=>{ const y=o.fn(m); if(!isFinite(y)) return; g.beginPath(); g.arc(X(m),Y(y),5,0,7); g.fillStyle='#2149c9'; g.fill(); });
}

function testValue(raw){
  const out=document.getElementById('tvout'); if(!out) return;
  const x=parseFloat(String(raw).replace(/[−–]/g,'-').replace(',','.'));
  if(!isFinite(x)){ out.innerHTML='<p class="muted">Bitte eine Zahl eingeben.</p>'; return; }
  let h='<table>'; let neg=0, zero=false, pole=false;
  EX.factors.forEach(f=>{ const v=factorValue(f,x), s=factorSign(f,x); if(s<0)neg++; if(s===0){ if(f.den) pole=true; else zero=true; }
    h+=`<tr><td>${mx(f.label)}</td><td>= ${fmtDec(v)}</td><td><span class="sg ${sgClass(sym(s))}">${sym(s)}</span></td></tr>`; });
  const A=EXA; let col=A.cols.findIndex(c=>c.type==='pt'?Math.abs(c.x-x)<1e-9:((c.lo===null||x>c.lo+1e-9)&&(c.hi===null||x<c.hi-1e-9)));
  const where = col>=0? (A.cols[col].type==='pt'? `der kritischen Stelle ${fmt(x)}`:`dem Intervall ${colLabel(A.cols[col])}`):'';
  const fv = pole?'n.d.':(zero?'0':(neg%2?MINUS:'+'));
  h+=`<tr><td colspan="2" style="border-top:2px solid #1c2330"><b>${mx('f′('+fmtDec(x)+')')}</b> = ${pole?'n.d.':fmtDec(EX.dfn(x))}</td><td style="border-top:2px solid #1c2330"><span class="sg ${sgClass(fv)}">${fv}</span></td></tr></table>`;
  h+=`<p class="muted" style="margin:.4em 0 0">${mx('x = '+fmtDec(x))} gehört zu ${where}. ${(!pole&&!zero)?`Anzahl Minuszeichen: ${neg}, also ${neg%2?'ungerade: −':'gerade: +'}`:''}</p>`;
  out.innerHTML=h;
}

         ()=>E('f′(x) = ')+F('4·(x² + 4) − 4x·2x','(x² + 4)²')+' = '+F('16 − 4x²','(x² + 4)²'),
         ()=>E('f′(x) = ')+F('−4(x + 2)(x − 2)','(x² + 4)²')],
  factors:[C(-4,'−4'),L(1,2,1,0,'x + 2'),L(1,-2,1,0,'x − 2'),P('(x² + 4)²',1)],fn:x=>4*x/(x*x+4),xr:[-8,8],yr:[-2,2]},
 {lvl:3,kind:'d1',fname:fP,disp:()=>E('f(x) = ')+F('x − 1','x²'),
  deriv:[()=>mx('u = x − 1,  u′ = 1;   v = x²,  v′ = 2x'),
         ()=>E('f′(x) = ')+F('1·x² − (x − 1)·2x','x⁴')+' = '+F('−x² + 2x','x⁴')+' = '+F('x(2 − x)','x⁴'),
         ()=>E('f′(x) = ')+F('2 − x','x³')+mx('  (mit x gekürzt)')],
  factors:[L(-1,2,1,0,'2 − x'),L(1,0,3,1,'x³')],fn:x=>(x-1)/(x*x),xr:[-4,8],yr:[-3,1],
  hintB:'Achtung: 2 − x ist links von 2 positiv und rechts von 2 negativ! x³ hat dasselbe Vorzeichen wie x.'}
];
TASKS.forEach((t,i)=>t.no=i+1);
const LVL={1:['Stufe 1','Nur die VZT – Faktoren gegeben'],2:['Stufe 2','Erst faktorisieren'],3:['Stufe 3','Mit Ableitung (Quotientenregel)']};

function statement(t){
  if(t.lvl===3) return `Bestimme ${mx('f′(x)')} mit der Quotientenregel und faktorisiere. Erstelle dann die VZT von ${mx('f′')} und gib Monotonie und Extremstellen von ${mx('f')} an.`;
  if(t.kind==='f') return `Erstelle die VZT von ${mx('f')} und gib an, wo der Graph oberhalb bzw. unterhalb der ${mx('x')}-Achse verläuft. Bestimme die Art der Null- und Polstellen.`+(t.lvl===2?' Faktorisiere dazu zuerst Zähler und Nenner.':'');
  if(t.kind==='d1') return `Gegeben ist die <b>Ableitung</b> ${mx('f′')} einer Funktion ${mx('f')}. Erstelle die VZT von ${mx('f′')} und bestimme Monotonie und Extremstellen von ${mx('f')}.`;
  return `Gegeben ist die <b>zweite Ableitung</b> ${mx('f″')} einer Funktion ${mx('f')}. Erstelle die VZT von ${mx('f″')} und bestimme das Krümmungsverhalten und die Wendestellen von ${mx('f')}.`;
}

/* ---------- Zustand ---------- */
let store={}; try{ store=JSON.parse(localStorage.getItem('vzt-status')||'{}')||{}; }catch(e){ store={}; }
function saveStore(){ try{ localStorage.setItem('vzt-status',JSON.stringify(store)); }catch(e){} }
const ST={};
function st(t){ if(!ST[t.no]) ST[t.no]={stage:'A',zIn:'',pIn:'',cells:{},interp:{},marks:{},fbA:null,fbB:null,fbC:null,help:false,deriv:0,sel:null,showHint:{}}; return ST[t.no]; }
let cur=0;

function parseList(s){
  s=String(s).trim().toLowerCase();
  if(!s||/^(keine?|-|—|–|leer|∅|\{\}|nichts)$/.test(s)) return [];
  s=s.replace(/[−–]/g,'-').replace(/x\s*[0-9₀-₉]*\s*=/g,' ').replace(/[{}()]/g,' ').replace(/(\d),(\d)/g,'$1.$2');
  const toks=s.split(/[;,\s]+|und/).filter(Boolean), out=[];
  for(const tk of toks){
    let v;
    if(/^[-+]?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(tk)){ const [a,b]=tk.split('/'); v=parseFloat(a)/parseFloat(b); }
    else if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(tk)) v=parseFloat(tk);
    else return null;
    out.push(v);
  }
  return out;
}
const sameSet=(a,b)=>{ a=uniq(a); b=uniq(b); return a.length===b.length&&a.every((v,i)=>Math.abs(v-b[i])<1e-6); };

/* ---------- Rendering Übungen ---------- */
function renderTaskList(){
  let h='', last=0;
  TASKS.forEach((t,i)=>{
    if(t.lvl!==last){ h+=`<div class="lvl">${LVL[t.lvl][0]}<span>${LVL[t.lvl][1]}</span></div>`; last=t.lvl; }
    const s=store[t.no]; const mark=s==='ok'?'<span class="st ok">✓</span>':s==='help'?'<span class="st help" title="mit Lösungshilfe">◐</span>':'';
    h+=`<button data-t="${i}" class="${i===cur?'active':''}">Aufgabe ${t.no}${mark}</button>`;
  });
  return `<div class="card tasklist">${h}<div class="lvl" style="margin-top:16px"></div><button id="resetAll" class="muted" style="font-size:.85rem">Fortschritt zurücksetzen</button></div>`;
}

function renderEx(){
  const v=document.getElementById('view-uebungen');
  v.innerHTML=`<div class="ex">${renderTaskList()}<div class="card task" id="taskpanel"></div></div>`;
  v.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{cur=+b.dataset.t;renderEx();});
  document.getElementById('resetAll').onclick=()=>{ store={}; saveStore(); for(const k in ST) delete ST[k]; renderEx(); };
  renderTask();
}

function renderTask(){
  const t=TASKS[cur], s=st(t), A=analyze(t), K=KIND[t.kind];
  const p=document.getElementById('taskpanel');
  const fnm=t.fname;
  const nm = t.kind==='f'?'f(x)':fnm;
  let h=`<h2>Aufgabe ${t.no}<small>${LVL[t.lvl][0]} · ${LVL[t.lvl][1]}</small></h2>
    <p>${statement(t)}</p><div class="func">${t.disp()}</div>`;
  if(t.deriv){
    h+=`<div class="deriv"><b>Ableitung bestimmen</b> <span class="muted">– rechne zuerst selbst, dann vergleiche:</span>
      ${t.deriv.slice(0,s.deriv).map(d=>`<div class="ds">${d()}</div>`).join('')}
      ${s.deriv<t.deriv.length?`<button class="btn" id="dmore">${['Ansatz zeigen','Zwischenergebnis zeigen','Faktorisiertes Ergebnis zeigen'][s.deriv]}</button>`:''}</div>`;
  }
  const term = t.lvl===3?'f′(x)':nm;
  // Stufe A
  const passA=s.stage!=='A';
  h+=`<div class="stage ${passA?'passed':''}"><h3><span class="badge">1</span><span>Kritische Stellen von ${mx(term)}</span></h3>
    <div class="field"><label>Nullstellen des <b>Zählers</b>:</label><input id="zIn" value="${s.zIn}" placeholder="z. B. −2; 1" ${passA?'disabled':''} class="${passA?'ok':(s.fbA&&s.fbA.z===false?'bad':'')}" autocomplete="off"></div>
    <div class="field"><label>Nullstellen des <b>Nenners</b> (Definitionslücken):</label><input id="pIn" value="${s.pIn}" placeholder="z. B. 3" ${passA?'disabled':''} class="${passA?'ok':(s.fbA&&s.fbA.p===false?'bad':'')}" autocomplete="off"></div>
    <p class="muted" style="font-size:.9rem;margin:4px 0">Mehrere Werte mit Semikolon trennen. Gibt es keine, das Feld leer lassen.</p>
    ${!passA?`<div class="row"><button class="btn primary" id="chkA">Prüfen</button><button class="btn ghost" id="hintA">Tipp</button><button class="btn ghost" id="solA">Lösung zeigen</button></div>`:''}
    ${s.showHint.A&&!passA?`<div class="fb info">${mx(t.hintA||(t.deriv?'Setze Zähler und Nenner der faktorisierten Ableitung jeweils gleich null.':'Ein Produkt ist null, wenn einer der Faktoren null ist. Setze jeden Faktor gleich null.'))}</div>`:''}
    ${s.fbA?`<div class="fb ${s.fbA.ok?'ok':'bad'}">${s.fbA.msg}</div>`:''}
    ${passA&&t.fact?`<div class="fb info">Faktorisierte Form: ${t.fact()}</div>`:''}
    </div>`;
  // Stufe B
  const lockedB=s.stage==='A', passB=s.stage==='C'||s.stage==='done';
  h+=`<div class="stage ${lockedB?'locked':''} ${passB?'passed':''}"><h3><span class="badge">2</span> Vorzeichentabelle ausfüllen</h3>`;
  if(lockedB) h+=`<p class="muted">Erst Schritt 1 lösen – dann erscheint hier die Tabelle.</p></div>`;
  else{
    h+=`<div id="tblArea"></div>`;
    h+=`<div class="palette" id="pal" ${passB&&s.stage!=='C'?'hidden':''}></div>`;
    if(s.stage==='B') h+=`<div class="row"><button class="btn primary" id="chkB">Prüfen</button><button class="btn ghost" id="hintB">Tipp</button><button class="btn ghost" id="solB">Lösung zeigen</button></div>`;
    if(s.showHint.B&&s.stage==='B') h+=`<div class="fb info">Linearfaktor ${mx('(x − a)')}: links von ${mx('a')} „−“, bei ${mx('a')} „0“, rechts „+“. In der letzten Zeile die Minuszeichen jeder Spalte zählen: gerade → „+“, ungerade → „−“. An Definitionslücken: „n.d.“. ${t.hintB?'<br><b>Hier:</b> '+mx(t.hintB):''}</div>`;
    if(s.fbB) h+=`<div class="fb ${s.fbB.ok?'ok':'bad'}">${s.fbB.msg}</div>`;
    h+='</div>';
  }
  // Stufe C
  const lockedC=s.stage==='A'||s.stage==='B';
  h+=`<div class="stage ${lockedC?'locked':''} ${s.stage==='done'?'passed':''}"><h3><span class="badge">3</span> Deuten</h3>`;
  if(lockedC) h+=`<p class="muted">Wähle hier anschließend in der Tabelle die Bedeutung jeder Spalte aus.</p></div>`;
  else{
    h+=`<p class="muted" style="margin:0">Wähle in der Zeile „Bedeutung“ der Tabelle für jede Spalte die passende Deutung.</p>`;
    if(s.stage==='C') h+=`<div class="row" style="margin-top:10px"><button class="btn primary" id="chkC">Prüfen</button><button class="btn ghost" id="hintC">Tipp</button><button class="btn ghost" id="solC">Lösung zeigen</button></div>`;
    if(s.showHint.C&&s.stage==='C') h+=`<div class="fb info">${t.kind==='f'?'„+“ bedeutet: Graph oberhalb der x-Achse. Ändert sich das Vorzeichen links und rechts einer Stelle, liegt ein VZW vor.':t.kind==='d1'?'f′ > 0: f steigt; f′ < 0: f fällt. Vorzeichen von f′ an einer Nullstelle: + → − Hochpunkt, − → + Tiefpunkt, gleich: Sattelpunkt. An Polstellen gibt es keine Extrempunkte.':'f″ > 0: linksgekrümmt; f″ < 0: rechtsgekrümmt. VZW an einer Nullstelle von f″ ⇒ Wendestelle. An Polstellen gibt es keine Wendestelle.'}</div>`;
    if(s.fbC) h+=`<div class="fb ${s.fbC.ok?'ok':'bad'}">${s.fbC.msg}</div>`;
    h+='</div>';
  }
  if(s.stage==='done'){
    h+=`<div class="success"><h3>Geschafft! ${s.help?'(mit Hilfe)':''}</h3>${summary(t,A)}
      <p class="muted" style="margin:8px 0 6px">${t.kind==='f'?`Graph von ${mx('f')} – vergleiche mit deiner Tabelle:`:`Graph der Funktion ${t.fdisp?t.fdisp():mx('f')} – also von ${mx('f')}, nicht von ${mx(t.kind==='d1'?'f′':'f″')}:`}</p>
      <canvas class="plot" id="tplot"></canvas>
      <div class="row" style="margin-top:12px">${cur<TASKS.length-1?`<button class="btn primary" id="nextT">Nächste Aufgabe →</button>`:''}<button class="btn" id="resetT">Aufgabe neu starten</button></div></div>`;
  } else h+=`<div class="row" style="margin-top:14px"><button class="btn ghost" id="resetT">Aufgabe neu starten</button></div>`;
  p.innerHTML=h;

  // Events
  const zi=document.getElementById('zIn'), pi=document.getElementById('pIn');
  if(zi){ zi.oninput=()=>s.zIn=zi.value; pi.oninput=()=>s.pIn=pi.value; [zi,pi].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter') checkA();})); }
  bind('dmore',()=>{s.deriv++;renderTask();});
  bind('chkA',checkA); bind('hintA',()=>{s.showHint.A=true;renderTask();});
  bind('solA',()=>{s.zIn=A.zeros.map(fmt).join('; '); s.pIn=A.poles.map(fmt).join('; '); s.help=true; checkA();});
  bind('chkB',checkB); bind('hintB',()=>{s.showHint.B=true;renderTask();});
  bind('solB',()=>{ t.factors.forEach((f,i)=>A.cols.forEach((c,j)=>s.cells[i+'-'+j]=A.rows[i][j])); A.cols.forEach((c,j)=>s.cells['r-'+j]=A.res[j]); s.help=true; checkB(); });
  bind('chkC',checkC); bind('hintC',()=>{s.showHint.C=true;renderTask();});
  bind('solC',()=>{ A.cols.forEach((c,j)=>s.interp[j]=A.interp[j]); s.help=true; checkC(); });
  bind('nextT',()=>{cur++;renderEx();window.scrollTo({top:0,behavior:'smooth'});});
  bind('resetT',()=>{delete ST[t.no];renderTask();});
  if(!lockedB){ renderTable(); }
  if(s.stage==='done') drawPlot(document.getElementById('tplot'),{fn:t.fn,xr:t.xr,yr:t.yr,poles:A.poles,marks:A.zeros});

  function checkA(){
    const z=parseList(s.zIn), q=parseList(s.pIn);
    if(z===null||q===null){ s.fbA={ok:false,msg:'Die Eingabe konnte nicht gelesen werden. Gib nur Zahlen ein, getrennt durch Semikolon (z. B. <b>−2; 1</b>). Brüche wie 1/2 sind erlaubt.'}; renderTask(); return; }
    const okZ=sameSet(z,A.zeros), okP=sameSet(q,A.poles);
    if(okZ&&okP){ s.stage='B'; s.fbA={ok:true,msg:`Richtig! Kritische Stellen: ${A.pts.length?A.pts.map(fmt).join(';  '):'keine'}. Damit hat die Tabelle ${A.cols.filter(c=>c.type==='iv').length} Intervalle.`}; s.sel={r:0,j:0}; }
    else{
      let m=[]; if(!okZ) m.push('Die Nullstellen des <b>Zählers</b> stimmen noch nicht.'); if(!okP) m.push('Die Nullstellen des <b>Nenners</b> stimmen noch nicht.');
      if(!okZ&&z.some(v=>A.poles.some(p=>Math.abs(p-v)<1e-6))) m.push('Achtung: Du hast eine Nennernullstelle beim Zähler eingetragen.');
      if(!okZ&&z.length<A.zeros.length) m.push('Es fehlen Werte – hast du alle Faktoren betrachtet?');
      s.fbA={ok:false,msg:m.join(' '),z:okZ,p:okP};
    }
    renderTask();
  }
  function checkB(){
    let bad=0, empty=0;
    const test=(key,exp)=>{ const v=s.cells[key]||''; if(!v){empty++; s.marks[key]='bad';} else if(v===exp) s.marks[key]='ok'; else {bad++; s.marks[key]='bad';} };
    t.factors.forEach((f,i)=>A.cols.forEach((c,j)=>test(i+'-'+j,A.rows[i][j])));
    A.cols.forEach((c,j)=>test('r-'+j,A.res[j]));
    if(!bad&&!empty){ s.stage='C'; s.sel=null; s.fbB={ok:true,msg:'Alle Vorzeichen stimmen!'}; }
    else s.fbB={ok:false,msg:`${bad?bad+' Feld'+(bad>1?'er sind':' ist')+' falsch':''}${bad&&empty?', ':''}${empty?empty+' Feld'+(empty>1?'er sind':' ist')+' noch leer':''} (rot markiert).`};
    renderTask();
  }
  function checkC(){
    let bad=0;
    A.cols.forEach((c,j)=>{ const ok=s.interp[j]===A.interp[j]; s.marks['i-'+j]=ok?'ok':'bad'; if(!ok) bad++; });
    if(!bad){ s.stage='done'; s.fbC={ok:true,msg:'Alle Deutungen stimmen!'}; store[t.no]=s.help?'help':'ok'; saveStore(); renderEx(); return; }
    s.fbC={ok:false,msg:`${bad} Deutung${bad>1?'en sind':' ist'} noch falsch oder fehlt.`};
    renderTask();
  }
}
function bind(id,fn){ const el=document.getElementById(id); if(el) el.onclick=fn; }

function summary(t,A){
  const K=KIND[t.kind]; const groups={};
  A.cols.forEach((c,j)=>{ if(c.type==='iv'){ (groups[A.interp[j]]=groups[A.interp[j]]||[]).push(colLabel(c)); } });
  let h='<ul class="summary">';
  for(const k in groups) h+=`<li>${mx(k.charAt(0).toUpperCase()+k.slice(1))} für ${groups[k].join(' und ')}</li>`;
  A.cols.forEach((c,j)=>{ if(c.type==='pt') h+=`<li>${mx('x = '+fmt(c.x))}: ${mx(A.interp[j])}</li>`; });
  return h+'</ul>';
}

function renderTable(){
  const t=TASKS[cur], s=st(t), A=analyze(t), K=KIND[t.kind];
  const area=document.getElementById('tblArea'); if(!area) return;
  const editable=s.stage==='B';
  const cell=(key,type)=>{
    const v=s.cells[key]||'', mk=s.marks[key]||'', sel=s.sel&&(key===(s.sel.r==='r'?'r':s.sel.r)+'-'+s.sel.j);
    if(!editable) return `<td class="${type} ${mk==='ok'?'':''}"><span class="sg ${sgClass(v)}">${v}</span></td>`;
    return `<td class="cell ${type} ${mk} ${sel?'sel':''}"><button data-k="${key}" aria-label="Feld">${v?`<span class="${sgClass(v)}">${v}</span>`:''}</button></td>`;
  };
  let h=`<div class="tblwrap"><table class="vzt"><tr><th class="lab">${mx('x')}</th>`+A.cols.map(c=>`<th class="${c.type==='pt'?'pt ptH':'iv'}">${colLabel(c)}</th>`).join('')+'</tr>';
  t.factors.forEach((f,i)=>{ h+=`<tr><th class="lab">${rowLabel(f)}</th>`+A.cols.map((c,j)=>cell(i+'-'+j,c.type)).join('')+'</tr>'; });
  h+=`<tr class="resrow"><th class="lab">${mx(t.fname)}</th>`+A.cols.map((c,j)=>cell('r-'+j,c.type)).join('')+'</tr>';
  if(s.stage==='C'||s.stage==='done'){
    h+=`<tr class="introw"><th class="lab">Bedeutung</th>`+A.cols.map((c,j)=>{
      const opts=c.type==='iv'?K.ivOpts:K.ptOpts, mk=s.marks['i-'+j]||'';
      if(s.stage==='done') return `<td class="${c.type} ok">${mx(A.interp[j])}</td>`;
      return `<td class="${c.type} ${mk}"><select data-i="${j}"><option value="">– wählen –</option>${opts.map(o=>`<option ${s.interp[j]===o?'selected':''}>${o}</option>`).join('')}</select></td>`;
    }).join('')+'</tr>';
  }
  area.innerHTML=h+'</table></div>';
  area.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ const [r,j]=b.dataset.k.split('-'); s.sel={r:r==='r'?'r':+r,j:+j}; renderTable(); });
  area.querySelectorAll('[data-i]').forEach(sel=>sel.onchange=()=>{ s.interp[+sel.dataset.i]=sel.value; delete s.marks['i-'+sel.dataset.i]; sel.parentElement.classList.remove('ok','bad'); });
  // Palette
  const pal=document.getElementById('pal');
  if(pal){
    if(!editable){ pal.innerHTML=''; pal.hidden=true; return; }
    pal.hidden=false;
    const isRes=s.sel&&s.sel.r==='r';
    pal.innerHTML=['+',MINUS,'0','n.d.'].map(v=>`<button data-v="${v}" class="${sgClass(v)}" ${(!s.sel||(v==='n.d.'&&!isRes))?'disabled':''}>${v}</button>`).join('')+
      `<button data-v="" ${!s.sel?'disabled':''} style="font-size:.95rem;min-width:70px">löschen</button><span class="hint">${s.sel?'Wert für das markierte Feld wählen':'Tippe zuerst ein Feld in der Tabelle an.'}</span>`;
    pal.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setVal(b.dataset.v));
  }
}
function setVal(v){
  const t=TASKS[cur], s=st(t), A=analyze(t); if(!s.sel||s.stage!=='B') return;
  const key=(s.sel.r==='r'?'r':s.sel.r)+'-'+s.sel.j;
  if(v==='n.d.'&&s.sel.r!=='r') return;
  s.cells[key]=v; delete s.marks[key];
  if(v!==''){ // weiter zum nächsten Feld
    const n=A.cols.length;
    if(s.sel.j<n-1) s.sel.j++;
    else if(s.sel.r!=='r'){ s.sel.r = s.sel.r<t.factors.length-1? s.sel.r+1 : 'r'; s.sel.j=0; }
  }
  renderTable();
}
document.addEventListener('keydown',e=>{
  if(location.hash!=='#uebungen') return;
  const t=TASKS[cur], s=st(t); if(!s.sel||s.stage!=='B') return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  const A=analyze(t), rows=t.factors.length;
  const k=e.key;
  if(k==='+'){setVal('+');e.preventDefault();}
  else if(k==='-'||k==='−'){setVal(MINUS);e.preventDefault();}
  else if(k==='0'){setVal('0');e.preventDefault();}
  else if(k==='n'||k==='N'){setVal('n.d.');e.preventDefault();}
  else if(k==='Backspace'||k==='Delete'){setVal('');e.preventDefault();}
  else if(k.startsWith('Arrow')){
    let r=s.sel.r==='r'?rows:s.sel.r, j=s.sel.j;
    if(k==='ArrowRight') j=Math.min(A.cols.length-1,j+1);
    if(k==='ArrowLeft') j=Math.max(0,j-1);
    if(k==='ArrowDown') r=Math.min(rows,r+1);
    if(k==='ArrowUp') r=Math.max(0,r-1);
    s.sel={r:r===rows?'r':r,j}; renderTable(); e.preventDefault();
  }
});

/* ---------- Navigation ---------- */
function route(){
  const ex=location.hash==='#uebungen';
  document.getElementById('view-anleitung').hidden=ex;
  document.getElementById('view-uebungen').hidden=!ex;
  document.getElementById('tab-anleitung').classList.toggle('active',!ex);
  document.getElementById('tab-uebungen').classList.toggle('active',ex);
  if(ex) renderEx(); else renderGuide();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
let rT; window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ const g=document.getElementById('gplot'); if(g) drawPlot(g,{fn:EX.fn,xr:EX.xr,yr:EX.yr,poles:EXA.poles,marks:EXA.zeros}); const tp=document.getElementById('tplot'); if(tp){ const t=TASKS[cur],A=analyze(t); drawPlot(tp,{fn:t.fn,xr:t.xr,yr:t.yr,poles:A.poles,marks:A.zeros}); } },150); });
route();
</script>
